name: Bug report
description: Report a reproducible defect without including secrets or production data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Before filing a security issue, follow SECURITY.md instead of posting it publicly.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, command, deployment mode, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use sanitized fixtures and the smallest reliable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and evidence
      description: Include sanitized logs, screenshots, or report excerpts.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, personal data, DSNs, tokens, and private host details.
          required: true
