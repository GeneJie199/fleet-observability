name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -timeout 180s ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 240s ./...
      - name: Static analysis
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Reachable vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Security and secret scan
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/security-check.sh
      - name: Compatibility parser fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: go test -parallel=2 -run='^$' -fuzz='^FuzzCompatibilityParsers$' -fuzztime=5s ./internal/compat
      - name: Build
        run: go build ./...
      - name: CLI smoke
        shell: bash
        run: |
          go build -trimpath -o fleetctl ./cmd/fleetctl
          ./fleetctl version
          ./fleetctl up --help
          ./fleetctl doctor --help
          sh -n scripts/install.sh
      - name: Verify Windows installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }
