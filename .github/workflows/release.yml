name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: release gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 180s ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 240s ./...
      - name: Static analysis
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Reachable vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Changelog contains release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version%%-*}" CHANGELOG.md

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="fleetscope-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$package"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$package/fleetctl${{ matrix.ext }}" ./cmd/fleetctl
          cp README.md CHANGELOG.md LICENSE SECURITY.md "$package/"
          cp -R deploy docs examples scripts "$package/"
          if [ "$GOOS" = windows ]; then
            7z a -tzip "${package}.zip" "./${package}/*"
          else
            tar -czf "${package}.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fleetscope-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fleetscope-*.tar.gz
            fleetscope-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum fleetscope-* > checksums.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
