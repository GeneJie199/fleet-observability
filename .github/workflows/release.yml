name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: release gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.os == 'macos-latest' && '1.27.3' || '1.26.10' }}
          cache: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 180s ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 240s ./...
      - name: Static analysis
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Reachable vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Security and secret scan
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/security-check.sh
      - name: Compatibility parser fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: go test -parallel=2 -run='^$' -fuzz='^FuzzCompatibilityParsers$' -fuzztime=5s ./internal/compat
      - name: Changelog contains release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## ${version%%-*}" CHANGELOG.md
      - name: Verify installer syntax
        if: matrix.os == 'ubuntu-latest'
        run: sh -n scripts/install.sh
      - name: Verify Windows installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${GITHUB_REF_NAME#v}"
          binary="fleetctl-${GOOS}-${GOARCH}${{ matrix.ext }}"
          package="fleetscope-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$package"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$binary" ./cmd/fleetctl
          cp "$binary" "$package/fleetctl${{ matrix.ext }}"
          cp README.md CHANGELOG.md LICENSE SECURITY.md "$package/"
          cp -R LICENSES "$package/"
          cp NOTICE LICENSE_METADATA.json third-party-inventory.json third-party.cdx.json *_POLICY.md COMMERCIAL_LICENSE.md COMMERCIALIZATION.md LICENSING_HISTORY.md THIRD_PARTY_NOTICES.md "$package/"
          cp -R deploy docs examples scripts "$package/"
          (cd "$package" && sha256sum "fleetctl${{ matrix.ext }}" > checksums.txt && sha256sum -c checksums.txt)
          if [ "$GOOS" = windows ]; then
            zip -qr "${package}.zip" "$package"
          else
            tar -czf "${package}.tar.gz" "$package"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: fleetscope-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            fleetscope-*.tar.gz
            fleetscope-*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -licenses -json -output "dist/fleetscope-${GITHUB_REF_NAME}.cdx.json" .
          cd dist && sha256sum fleetctl-* fleetscope-* > checksums.txt
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
