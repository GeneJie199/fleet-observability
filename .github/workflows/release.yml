name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Candidate tag to verify without publishing
        required: true
        default: v2.0.0-rc.1
        type: string

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    name: release gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ startsWith(matrix.os, 'macos-') && '1.27.3' || '1.26.10' }}
          cache: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 180s ./...
      - name: Race detector
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -timeout 240s ./...
      - name: Static analysis
        if: matrix.os == 'ubuntu-latest'
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - name: Reachable vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Security and secret scan
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/security-check.sh
      - name: Compatibility parser fuzz smoke
        if: matrix.os == 'ubuntu-latest'
        run: go test -parallel=2 -run='^$' -fuzz='^FuzzCompatibilityParsers$' -fuzztime=5s ./internal/compat
      - name: Validate release license and version metadata
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          python3 scripts/license-guard.py
          python3 -c 'import json,os; assert "v"+json.load(open("LICENSE_METADATA.json"))["sourceVersion"] == os.environ["RELEASE_TAG"], "tag and license metadata version differ"'
      - name: Changelog contains release
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          grep -q "^## ${version%%-*}" CHANGELOG.md
      - name: Verify installer syntax
        if: matrix.os == 'ubuntu-latest'
        run: sh -n scripts/install.sh
      - name: Verify Windows installer syntax
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/install.ps1'), [ref]$null, [ref]$errors)
          if ($errors.Count) { $errors | Format-List; exit 1 }

      - name: Verify native macOS release binary
        if: runner.os == 'macOS'
        shell: bash
        env:
          CGO_ENABLED: 0
          GOTOOLCHAIN: go1.27.3
        run: |
          mkdir -p .qa/native
          binary=".qa/native/fleetctl-darwin-$(go env GOARCH)"
          go build -trimpath -ldflags "-s -w -X main.version=${RELEASE_TAG#v}" -o "$binary" ./cmd/fleetctl
          "$binary" version
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: native-${{ runner.arch }}
          include-hidden-files: true
          path: .qa/native/*

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: linux, goarch: arm64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/download-artifact@v8
        if: matrix.goos == 'darwin'
        with:
          name: native-${{ matrix.goarch == 'amd64' && 'X64' || 'ARM64' }}
          path: .qa/native-verified
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          version="${RELEASE_TAG#v}"
          binary="fleetctl-${GOOS}-${GOARCH}${{ matrix.ext }}"
          package="fleetscope-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$package"
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$binary" ./cmd/fleetctl
          cp "$binary" "$package/fleetctl${{ matrix.ext }}"
          cp README.md CHANGELOG.md LICENSE SECURITY.md "$package/"
          cp -R LICENSES "$package/"
          cp NOTICE LICENSE_METADATA.json third-party-inventory.json third-party.cdx.json *_POLICY.md COMMERCIAL_LICENSE.md COMMERCIALIZATION.md LICENSING_HISTORY.md THIRD_PARTY_NOTICES.md "$package/"
          cp -R deploy docs examples scripts "$package/"
          (cd "$package" && sha256sum "fleetctl${{ matrix.ext }}" > checksums.txt && sha256sum -c checksums.txt)
          if [ "$GOOS" = windows ]; then
            zip -qr "${package}.zip" "$package"
          else
            tar -czf "${package}.tar.gz" "$package"
          fi
      - name: Match native verified macOS bytes
        if: matrix.goos == 'darwin'
        shell: bash
        run: cmp "fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}" ".qa/native-verified/fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: fleetscope-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fleetctl-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
            fleetscope-*.tar.gz
            fleetscope-*.zip

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.12.0 mod -licenses -json -output "dist/fleetscope-${RELEASE_TAG}.cdx.json" .
          cd dist && sha256sum fleetctl-* fleetscope-* > checksums.txt
      - name: Package Corresponding Source
        run: |
          python3 scripts/package-corresponding-source.py --output "dist/fleet-observability-${RELEASE_TAG}-source.tar.gz"
          (cd dist && sha256sum *-source.tar.gz >> checksums.txt)
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          options=(--verify-tag --notes-file RELEASE_NOTES.md --title "fleet-observability ${tag}")
          [[ "$tag" == *-* ]] && options+=(--prerelease)
          # Create fails for an existing release; never update or clobber assets.
          gh release create "$tag" dist/* "${options[@]}"
